services:
  app:
    build:
      context: .
    container_name: medical-inventory-app
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      PORT: 8080
      DB_URL: jdbc:mysql://db:3306/medical_inventory
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in your environment}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in your environment}
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:?set ADMIN_BOOTSTRAP_TOKEN in your environment}
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: medical-inventory-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: medical_inventory
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in your environment}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
