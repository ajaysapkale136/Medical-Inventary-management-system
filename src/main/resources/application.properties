spring.application.name=medical-inventory
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8080}

# Cloud Reverse Proxy Headers (Render, Heroku, Cloudflare HTTPS forwarding)
server.forward-headers-strategy=framework
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.internal-proxies=.*

# Database Configuration (supports JDBC URL or URI like mysql://... or postgres://...)
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://mysql-3c3756e4-medical-mannagement.c.aivencloud.com:12923/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:1234}

# Server Error Handling (Return descriptive messages in API responses)
server.error.include-message=always
server.error.include-binding-errors=always

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Allow all origins with credentials for cloud deployments
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:*}

# Keep this empty unless an administrator explicitly configures a one-time bootstrap token.
app.auth.admin-bootstrap-token=${ADMIN_BOOTSTRAP_TOKEN:}

# Session Management & Cookies
server.servlet.session.cookie.name=MEDISTOCK_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=120m
