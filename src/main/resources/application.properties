spring.application.name=medical-inventory
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medical_inventory}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}

# Keep this empty unless an administrator explicitly configures a one-time bootstrap token.
app.auth.admin-bootstrap-token=${ADMIN_BOOTSTRAP_TOKEN:}

# Hardened Session Management & Cookies
server.servlet.session.cookie.name=MEDISTOCK_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=60m
