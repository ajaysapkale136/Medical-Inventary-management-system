services:
  - type: web
    name: medical-inventory-management
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    envVars:
      - key: PORT
        value: 8080
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: DDL_AUTO
        value: update
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_TOKEN
        generateValue: true
