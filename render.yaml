services:
  - type: web
    name: medical-inventory-management
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: DDL_AUTO
        value: update
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
