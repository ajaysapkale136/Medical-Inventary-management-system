# ==========================================================
# MediStock - PRODUCTION configuration (PostgreSQL)
# Activate with: --spring.profiles.active=prod
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medistock}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

medistock.jwt.secret=${JWT_SECRET}
medistock.frontend.url=${FRONTEND_URL:http://localhost:5173}
