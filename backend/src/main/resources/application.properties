# ==========================================================
# MediStock - DEVELOPMENT configuration (MySQL)
# ==========================================================
server.port=8080

# ---- MySQL database (create schema first: see database/schema.sql) ----
spring.datasource.url=jdbc:mysql://localhost:3306/medistock?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Avdhesh@2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" keeps tables in sync with entities. Use "validate" in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- JWT settings ----
# IMPORTANT: change this secret in production (min 32 characters).
medistock.jwt.secret=ChangeMeMediStockSuperSecretKey1234567890
medistock.jwt.expiration-ms=86400000

# ---- Business thresholds ----
medistock.stock.low-threshold=20
medistock.expiry.near-days=30

# ---- Email notifications (JavaMailSender) ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=avdheshsahu038@gmail.com
spring.mail.password=Avdhesh@2004
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
medistock.mail.enabled=false
medistock.mail.from=avdheshsahu038@gmail.com
medistock.mail.admin=admin@medistock.com

# ---- Twilio SMS (optional) ----
medistock.twilio.enabled=false
medistock.twilio.account-sid=YOUR_TWILIO_SID
medistock.twilio.auth-token=YOUR_TWILIO_TOKEN
medistock.twilio.from-number=+10000000000
medistock.twilio.to-number=+10000000000

# ---- Firebase Cloud Messaging (optional) ----
medistock.fcm.enabled=false
medistock.fcm.credentials-file=firebase-service-account.json

# ---- OAuth2 Google login ----
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ---- Frontend URL (CORS + OAuth2 redirect) ----
medistock.frontend.url=http://localhost:5173
